name: Deploy Uploader Worker

on:
  push:
    branches: [main]
    paths: [worker/**, folders.json, .github/workflows/deploy-worker.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip until Cloudflare is set up
        if: env.CONFIGURED != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set, so the uploader Worker was not deployed. See docs/adding-photos.md."

      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'

      - uses: actions/setup-node@v4
        if: env.CONFIGURED == 'true'
        with:
          node-version: 22

      - name: Test
        if: env.CONFIGURED == 'true'
        run: node --test "worker/test/*.test.js"

      # The Worker keeps the site's manifest in KV. Find or create the namespace
      # and bind it. Without it the Worker still works, but rebuilds the
      # manifest from Cloudinary more often.
      - name: Bind the manifest KV namespace
        if: env.CONFIGURED == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -fsS -H "$auth" "$api?per_page=100" | jq -r '.result[] | select(.title == "showcase-manifest") | .id' | head -n 1)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d '{"title":"showcase-manifest"}' "$api" | jq -r '.result.id')
          fi
          if [ -z "$id" ] || [ "$id" = null ]; then echo "::warning::No KV namespace; the Worker runs without one."; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "MANIFEST"\nid = "%s"\n' "$id" >> worker/wrangler.toml
          echo "Bound KV namespace showcase-manifest ($id)"

      # Deploy once before setting secrets so the Worker exists on the first run.
      - name: Deploy
        if: env.CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Set secrets and redeploy
        if: env.CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            GOOGLE_CLIENT_ID
            OWNER_EMAIL
            CLOUDINARY_CLOUD_NAME
            CLOUDINARY_API_KEY
            CLOUDINARY_API_SECRET
            GH_DISPATCH_TOKEN
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GH_DISPATCH_TOKEN: ${{ secrets.UPLOADER_GITHUB_TOKEN }}
