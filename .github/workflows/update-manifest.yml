name: Update Image Manifest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate-manifest.js, worker/src/manifest.js]

permissions:
  contents: write

# The admin page starts a run after every change, to keep this static copy
# (the site's fallback; the site reads the Worker's live manifest) up to date.
# Runs wait for each other, and each checks out main as it is when it starts,
# so a run builds on the previous run's commit instead of failing to push.
# A queued run reads Cloudinary when it starts, so it covers any it replaces.
concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run generate-manifest
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images-manifest.json
          git diff --cached --quiet || git commit -m "Update images manifest"
          git push
