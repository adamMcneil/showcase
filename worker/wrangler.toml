name = "showcase-uploader"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Secrets (set by .github/workflows/deploy-worker.yml from GitHub secrets/variables):
#   GOOGLE_CLIENT_ID, OWNER_EMAIL, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY,
#   CLOUDINARY_API_SECRET, GH_DISPATCH_TOKEN
[vars]
ALLOWED_ORIGINS = "https://adammcneil.github.io,http://localhost:5173,http://localhost:4173"
GITHUB_REPO = "adamMcneil/showcase"
# The deployed site; its static manifest has dates for photos uploaded before
# the admin page saved them.
SITE_URL = "https://adammcneil.github.io/showcase/"

# KV namespace MANIFEST (the site's manifest) is bound at deploy time by
# .github/workflows/deploy-worker.yml, which finds or creates "showcase-manifest".
